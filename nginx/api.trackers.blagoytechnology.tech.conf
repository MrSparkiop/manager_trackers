# api.trackers.blagoytechnology.tech → NestJS backend (port 3000)
# Handles REST API and WebSocket (socket.io) directly.
#
# After running: sudo certbot --nginx -d api.trackers.blagoytechnology.tech
# Certbot will add the SSL block and HTTP→HTTPS redirect automatically.

server {
    server_name api.trackers.blagoytechnology.tech;

    # Allow larger request bodies (file uploads, webhook payloads)
    client_max_body_size 20M;

    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;

        # WebSocket support — required for socket.io
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    listen 80;
}
