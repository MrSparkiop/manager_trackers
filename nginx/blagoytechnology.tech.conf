# blagoytechnology.tech + www → Portfolio (served from /var/www/portfolio)
# Replace with your real portfolio app when ready.
#
# After running:
#   sudo certbot --nginx -d blagoytechnology.tech -d www.blagoytechnology.tech
# Certbot adds SSL and HTTP→HTTPS redirect automatically.

server {
    server_name blagoytechnology.tech www.blagoytechnology.tech;

    root  /var/www/portfolio;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
    }

    listen 80;
}
