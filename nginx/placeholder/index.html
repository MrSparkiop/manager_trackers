<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blagoy Technology</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 1rem; color: #6366f1; }
    p  { font-size: 1.1rem; color: #94a3b8; max-width: 480px; line-height: 1.6; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
           background: #6366f1; margin: 2rem 4px 0; animation: pulse 1.4s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
                       40% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <h1>Blagoy Technology</h1>
  <p>Portfolio coming soon. Projects are already live — check back for the full showcase.</p>
  <div>
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
</body>
</html>
