# trackers.blagoytechnology.tech → Vite dev server (port 5173)
# Vite internally proxies /api and /socket.io to the NestJS backend container.
#
# After running: sudo certbot --nginx -d trackers.blagoytechnology.tech
# Certbot will add the SSL block and HTTP→HTTPS redirect automatically.

server {
    server_name trackers.blagoytechnology.tech;

    # Increase buffer sizes for larger API responses (e.g. Swagger docs)
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    location / {
        proxy_pass         http://localhost:5173;
        proxy_http_version 1.1;

        # WebSocket support — required for Vite HMR and socket.io
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_cache_bypass $http_upgrade;

        # Keep WebSocket connections alive
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    listen 80;
}
